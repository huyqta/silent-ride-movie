name = "silent-ride-v2"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "silent-ride-v2"

# D1 Database binding cho multi-source movies
[[d1_databases]]
binding = "DB"
database_name = "silent-ride-movies"
database_id = "eb4e041e-9025-4f1e-aafb-7d2e5923d998"
migrations_dir = "../../migrations"

[vars]
# Production secrets dùng: npx wrangler secret put ADMIN_SYNC_TOKEN --config wrangler.v2.toml
